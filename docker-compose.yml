version: "3.9"

services:
  mergeguard:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-changeme}
      - ORBIT_USE_LOCAL=${ORBIT_USE_LOCAL:-false}
      - MERGEGUARD_DB=/data/mergeguard.db
      - MERGEGUARD_PUBLIC_URL=${MERGEGUARD_PUBLIC_URL:-http://localhost:8080}
      # Optional integrations (see .env.example)
      - MERGEGUARD_AUTOFIX_ENABLED=${MERGEGUARD_AUTOFIX_ENABLED:-false}
      - MERGEGUARD_CI_GATE_ENABLED=${MERGEGUARD_CI_GATE_ENABLED:-false}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-}
    volumes:
      - mergeguard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mergeguard-data:
